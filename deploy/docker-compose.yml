# Muse Register — 服务器模式
# 用法（在 deploy/ 目录下）:
#   cp .env.server.example .env.server   # 填好管理员密码与会话密钥
#   docker compose up -d --build
#   打开 http://<服务器 IP>:8799 ，用 .env.server 里的账号登录
#
# 默认只绑 127.0.0.1:8799（本机访问）。要从外网访问请走反向代理 + HTTPS
#（见 README.md 的 Caddy 示例），不要直接把 8799 暴露到公网。
services:
  muse-register:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: muse-register:server
    container_name: muse-register
    restart: unless-stopped
    ports:
      - "127.0.0.1:8799:8799"
    env_file:
      - .env.server
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8799/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
